<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Balances · Submit Form</title>
    <!-- Simple, clean styling -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            background: #ffffff;
            max-width: 480px;
            width: 100%;
            border-radius: 32px;
            box-shadow: 0 20px 35px -8px rgba(0, 20, 30, 0.2), 0 8px 18px -6px rgba(0, 0, 0, 0.05);
            padding: 2.5rem 2rem 2.2rem;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b2b3c;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        h1 span {
            font-size: 1.9rem;
        }

        .subhead {
            font-size: 0.95rem;
            color: #577a8c;
            margin-bottom: 2rem;
            border-left: 4px solid #7fc1d9;
            padding-left: 0.9rem;
            font-weight: 400;
            background: #f0f7fb;
            border-radius: 0 12px 12px 0;
            line-height: 1.4;
            padding: 0.7rem 0 0.7rem 1rem;
        }

        .form-group {
            margin-bottom: 1.6rem;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1d4a5e;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        label i {
            font-style: normal;
            font-size: 1.1rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-symbol {
            position: absolute;
            left: 1.1rem;
            font-weight: 500;
            color: #2d6e8f;
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        input {
            width: 100%;
            padding: 1rem 1rem 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 500;
            background: #f9fdff;
            border: 1.5px solid #cde3ed;
            border-radius: 18px;
            outline: none;
            transition: all 0.2s ease;
            color: #113946;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0, 30, 40, 0.02);
        }

        input:hover {
            border-color: #9fc9dd;
            background: #ffffff;
        }

        input:focus {
            border-color: #2b8bb0;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(43, 139, 176, 0.12), 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        input:focus + .currency-symbol {
            color: #1c6a8c;
        }

        /* remove spinner for number inputs */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2.2rem;
        }

        button {
            background: #0b2b3c;
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 10px 18px -8px rgba(11, 43, 60, 0.4);
            letter-spacing: 0.01em;
            font-family: inherit;
        }

        button:hover {
            background: #124a62;
            box-shadow: 0 14px 22px -8px rgba(11, 43, 60, 0.5);
        }

        button:active {
            transform: scale(0.98);
            background: #0a2230;
        }

        button i {
            font-style: normal;
            font-size: 1.2rem;
        }

        .message {
            margin-top: 1.5rem;
            padding: 1rem 1.25rem;
            border-radius: 18px;
            background: #e3f2f9;
            color: #0e4d66;
            font-size: 0.95rem;
            border-left: 6px solid #1e90b0;
            font-weight: 500;
            display: none;
            word-break: break-word;
            transition: 0.2s;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #ffe9e9;
            border-left-color: #c73b3b;
            color: #7a1e1e;
        }

        .message.success {
            background: #e1f3e8;
            border-left-color: #1e8b5c;
            color: #145c3d;
        }

        .inline-hint {
            display: flex;
            justify-content: flex-end;
            font-size: 0.8rem;
            color: #5f8ca0;
            margin-top: 0.4rem;
            padding-right: 0.3rem;
            font-weight: 400;
        }

        /* small decorative dash */
        .field-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0.6rem 0 0.2rem;
        }

        .field-divider hr {
            flex: 1;
            border: none;
            border-top: 1px dashed #c3dae6;
        }

        .field-divider span {
            color: #7aaec2;
            font-size: 0.8rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            <span>💰</span> Cash position
        </h1>
        <div class="subhead">
            Update your cash balances — keep it accurate.
        </div>

        <!-- Form -->
        <form id="cashForm" novalidate>
            <!-- Cash in Hand -->
            <div class="form-group">
                <label for="cashInHand">
                    <i>🖐️</i> Cash in Hand
                </label>
                <div class="input-wrapper">
                    <span class="currency-symbol">$</span>
                    <input 
                        type="number" 
                        id="cashInHand" 
                        name="cashInHand" 
                        placeholder="0.00" 
                        step="0.01" 
                        min="0"
                        value=""
                        autocomplete="off"
                    >
                </div>
                <div class="inline-hint">available physical cash</div>
            </div>

            <!-- subtle divider -->
            <div class="field-divider">
                <hr>
                <span>➕</span>
                <hr>
            </div>

            <!-- Cash in Bank -->
            <div class="form-group" style="margin-top: 0.5rem;">
                <label for="cashInBank">
                    <i>🏦</i> Cash in Bank
                </label>
                <div class="input-wrapper">
                    <span class="currency-symbol">$</span>
                    <input 
                        type="number" 
                        id="cashInBank" 
                        name="cashInBank" 
                        placeholder="0.00" 
                        step="0.01" 
                        min="0"
                        value=""
                        autocomplete="off"
                    >
                </div>
                <div class="inline-hint">balance in bank accounts</div>
            </div>

            <!-- Submit + action -->
            <div class="actions">
                <button type="submit" id="submitBtn">
                    <i>📋</i> Submit balances
                </button>
            </div>
        </form>

        <!-- message / output area -->
        <div id="messageBox" class="message"></div>
    </div>

    <script>
        (function() {
            const form = document.getElementById('cashForm');
            const cashInHandInput = document.getElementById('cashInHand');
            const cashInBankInput = document.getElementById('cashInBank');
            const messageBox = document.getElementById('messageBox');
            const submitBtn = document.getElementById('submitBtn');

            // helper: show message with type
            function showMessage(text, type = 'info') {
                messageBox.textContent = text;
                messageBox.className = 'message show ' + type;  // type can be 'error', 'success', or '' (default)
            }

            // helper: clear message
            function clearMessage() {
                messageBox.textContent = '';
                messageBox.className = 'message';
            }

            // helper: parse input value to float (or null if empty)
            function parseBalance(value) {
                if (value.trim() === '') return null;
                const num = Number(value);
                return isNaN(num) ? NaN : num;   // NaN will be caught later
            }

            // validate single field: returns { valid, value, error }
            function validateField(inputEl, fieldName) {
                const raw = inputEl.value.trim();
                if (raw === '') {
                    return { valid: false, value: null, error: `${fieldName} cannot be empty.` };
                }
                const num = Number(raw);
                if (isNaN(num)) {
                    return { valid: false, value: null, error: `${fieldName} must be a valid number.` };
                }
                if (num < 0) {
                    return { valid: false, value: null, error: `${fieldName} cannot be negative.` };
                }
                // optional: round to 2 decimals for consistency, but we keep as is
                return { valid: true, value: num, error: null };
            }

            // main submit handler
            form.addEventListener('submit', function(event) {
                event.preventDefault();   // prevent page reload

                // clear old message
                clearMessage();

                // validate both fields
                const handCheck = validateField(cashInHandInput, 'Cash in Hand');
                const bankCheck = validateField(cashInBankInput, 'Cash in Bank');

                // collect errors
                const errors = [];
                if (!handCheck.valid) errors.push(handCheck.error);
                if (!bankCheck.valid) errors.push(bankCheck.error);

                if (errors.length > 0) {
                    // show first error (or combine) — we combine for better UX
                    showMessage(errors.join(' '), 'error');
                    // focus on first invalid field (optional)
                    if (!handCheck.valid) {
                        cashInHandInput.focus();
                    } else if (!bankCheck.valid) {
                        cashInBankInput.focus();
                    }
                    return;
                }

                // both valid → build result
                const cashInHand = handCheck.value;
                const cashInBank = bankCheck.value;
                const total = cashInHand + cashInBank;

                // Format values nicely (2 decimal)
                const formattedHand = cashInHand.toFixed(2);
                const formattedBank = cashInBank.toFixed(2);
                const formattedTotal = total.toFixed(2);

                // Show success message with details
                const successMsg = `✅ Balances submitted successfully!\n` +
                                   `Cash in Hand: $${formattedHand}\n` +
                                   `Cash in Bank: $${formattedBank}\n` +
                                   `Total cash position: $${formattedTotal}`;

                showMessage(successMsg, 'success');

                // (Optional) you could also log to console or send to backend.
                console.log('Form submitted with:', {
                    cashInHand: cashInHand,
                    cashInBank: cashInBank,
                    total: total,
                    timestamp: new Date().toISOString()
                });

                // optional: subtle button feedback
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i>⏳</i> Submitted';
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i>📋</i> Submit balances';
                }, 1200);
            });

            // live clearing of message when user types (optional, nice UX)
            cashInHandInput.addEventListener('input', function() {
                if (messageBox.classList.contains('show')) {
                    clearMessage();
                }
            });
            cashInBankInput.addEventListener('input', function() {
                if (messageBox.classList.contains('show')) {
                    clearMessage();
                }
            });

            // Optional: prevent negative typing via keydown (but let validation handle it)
            // Not needed, but we can ensure min attr works in modern browsers.
            // Also, treat empty field on blur? we keep simple.

            // If user presses enter from any field, form submit triggers (default)
            // extra: remove spinner not necessary, CSS handles.

            // For demonstration: set initial focus on first field (nice)
            window.addEventListener('load', function() {
                cashInHandInput.focus();
            });
        })();
    </script>
</body>
</html>
