{% extends 'base.html' %}

{% block title %}Opening Stock - Politory{% endblock %}

{% block content %}
<style>
    * {
        box-sizing: border-box;
    }

    .cash-wrapper {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
    }

    .card {
        background: #ffffff;
        max-width: 480px;
        width: 100%;
        border-radius: 28px;
        box-shadow: 0 20px 35px -8px rgba(0, 20, 30, 0.15), 0 8px 18px -6px rgba(0, 0, 0, 0.05);
        padding: 2.2rem 2rem;
        border: 1px solid #e2edf2;
    }

    h1 {
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0b2b3c;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .form-group {
        margin-bottom: 1.3rem;
    }

    label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        font-size: 0.92rem;
        color: #1d4a5e;
        margin-bottom: 0.4rem;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .currency-symbol {
        position: absolute;
        left: 1.1rem;
        font-weight: 600;
        color: #2d6e8f;
        font-size: 1rem;
        pointer-events: none;
    }

    input[type="number"],
    textarea {
        width: 100%;
        font-size: 0.95rem;
        font-weight: 500;
        background: #f9fdff;
        border: 1.5px solid #cde3ed;
        border-radius: 14px;
        outline: none;
        transition: all 0.2s ease;
        color: #113946;
        font-family: inherit;
    }

    input[type="number"] {
        padding: 0.85rem 1rem 0.85rem 2.4rem;
    }

    textarea {
        padding: 0.85rem 1rem;
        resize: vertical;
        min-height: 80px;
    }

    input:focus, textarea:focus {
        border-color: #2b8bb0;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(43, 139, 176, 0.12);
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .field-divider {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0.8rem 0;
    }

    .field-divider hr {
        flex: 1;
        border: none;
        border-top: 1px dashed #c3dae6;
    }

    .actions {
        margin-top: 1.5rem;
    }

    button {
        width: 100%;
        background: #0b2b3c;
        color: white;
        border: none;
        padding: 0.9rem 1.5rem;
        font-size: 1.05rem;
        font-weight: 600;
        border-radius: 30px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        transition: background 0.2s, transform 0.15s;
    }

    button:hover {
        background: #124a62;
    }

    button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .message {
        margin-top: 1.2rem;
        padding: 0.9rem 1.1rem;
        border-radius: 14px;
        font-size: 0.9rem;
        font-weight: 500;
        display: none;
        word-break: break-word;
    }

    .message.show { display: block; }
    .message.error { background: #ffe9e9; border-left: 5px solid #c73b3b; color: #7a1e1e; }
    .message.success { background: #e1f3e8; border-left: 5px solid #1e8b5c; color: #145c3d; }
</style>

<div class="cash-wrapper">
    <div class="card">
        <h1><span>💰</span> Cash Position</h1>

        <form id="cashForm" method="POST" novalidate>
            {% csrf_token %}

            <!-- Cash in Hand -->
            <div class="form-group">
                <label for="cashInHand"><i>🖐️</i> Cash in Hand</label>
                <div class="input-wrapper">
                    <span class="currency-symbol">Rs</span>
                    <input 
                        type="number" 
                        id="cashInHand" 
                        name="cashInHand" 
                        placeholder="0" 
                        min="0"
                        autocomplete="off"
                    >
                </div>
            </div>

            <div class="field-divider">
                <hr><span>➕</span><hr>
            </div>

            <!-- Cash in Bank -->
            <div class="form-group">
                <label for="cashInBank"><i>🏦</i> Cash in Bank</label>
                <div class="input-wrapper">
                    <span class="currency-symbol">Rs</span>
                    <input 
                        type="number" 
                        id="cashInBank" 
                        name="cashInBank" 
                        placeholder="0" 
                        min="0"
                        autocomplete="off"
                    >
                </div>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="discription"><i>📝</i> Description</label>
                <textarea 
                    id="discription" 
                    name="discription" 
                    placeholder="Enter details / remarks..."
                    maxlength="450"
                ></textarea>
            </div>

            <!-- Submit Button -->
            <div class="actions">
                <button type="submit" id="submitBtn">
                    <i>📋</i> Save Balances
                </button>
            </div>
        </form>

        <div id="messageBox" class="message"></div>
    </div>
</div>

<script>
    (function() {
        const form = document.getElementById('cashForm');
        const messageBox = document.getElementById('messageBox');
        const submitBtn = document.getElementById('submitBtn');

        function showMessage(text, type = 'info') {
            messageBox.textContent = text;
            messageBox.className = 'message show ' + type;
        }

        function clearMessage() {
            messageBox.textContent = '';
            messageBox.className = 'message';
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            clearMessage();

            const hand = document.getElementById('cashInHand').value.trim();
            const bank = document.getElementById('cashInBank').value.trim();

            if (!hand && !bank) {
                showMessage('Please enter at least Cash in Hand or Cash in Bank.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i>⏳</i> Saving...';

            const formData = new FormData(form);

            try {
                const response = await fetch(window.location.href, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    showMessage('✅ ' + result.message, 'success');
                    form.reset();
                } else {
                    showMessage(result.message || 'Error occurred while saving.', 'error');
                }
            } catch (err) {
                showMessage('Network error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i>📋</i> Save Balances';
            }
        });
    })();
</script>
{% endblock %}
